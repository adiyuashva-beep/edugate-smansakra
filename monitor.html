<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGate Smart Monitor - SMAN 1 Karanganyar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        /* --- VARIABEL WARNA (DINAMIS) --- */
        :root { 
            --bg-dark: #020617; 
            --card-bg: #0f172a; 
            
            /* Mode Pagi (Default) */
            --theme-primary: #38bdf8; /* Biru Langit */
            --theme-accent: #10b981;  /* Hijau */
            --theme-danger: #f43f5e;
            --theme-shadow: rgba(56, 189, 248, 0.4);
        }

        /* Mode Pulang (Override via Class) */
        body.mode-pulang {
            --theme-primary: #f59e0b; /* Orange Senja */
            --theme-accent: #8b5cf6;  /* Ungu Sore */
            --theme-danger: #ef4444;
            --theme-shadow: rgba(245, 158, 11, 0.4);
        }

        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg-dark); color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; transition: all 1s ease; }
        
        /* BACKGROUND EFFECT */
        body::before { 
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); 
            background-size: 50px 50px; 
            z-index: -1; pointer-events: none;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        /* HEADER */
        .header { height: 12vh; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 50px rgba(0,0,0,0.5); z-index: 20; position: relative; transition: border 1s; }
        .header::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 30%; height: 3px; background: var(--theme-primary); box-shadow: 0 0 20px var(--theme-primary); animation: scanningLine 6s ease-in-out infinite; transition: background 1s; }
        @keyframes scanningLine { 0% { left: 0; width: 0; opacity: 0; } 50% { width: 40%; opacity: 1; } 100% { left: 100%; width: 0; opacity: 0; } }

        .brand-left { display: flex; align-items: center; gap: 20px; }
        .logo-sekolah { height: 70px; width: auto; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2)); }
        .text-sekolah h1 { margin: 0; font-size: 1.8em; font-weight: 900; color: white; line-height: 1; letter-spacing: 1px; text-transform: uppercase; }
        .badge-system { color: var(--theme-primary); font-weight: 700; letter-spacing: 4px; font-size: 0.75em; display: block; margin-top: 5px; text-shadow: 0 0 10px var(--theme-shadow); transition: color 1s; }

        .header-right { display: flex; align-items: center; gap: 30px; }
        /* LOGO EDUGATE */
        .logo-siganteng { height: 60px; width: auto; filter: drop-shadow(0 0 10px var(--theme-primary)); animation: floatLogo 4s ease-in-out infinite; }
        @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .jam-digital { text-align: right; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 30px; }
        .waktu { font-family: 'Share Tech Mono', monospace; font-size: 3em; font-weight: 700; line-height: 0.9; color: white; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .tanggal { font-size: 0.9em; color: var(--theme-primary); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; }
        
        /* LAYOUT */
        .main-content { flex: 1; display: flex; padding: 25px; gap: 25px; height: 83vh; overflow: hidden; }
        .card-box { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; position: relative; transition: all 1s; }
        
        .corner-accent { position: absolute; width: 20px; height: 20px; border-color: var(--theme-primary); transition: border-color 1s; }
        .tl { top: 0; left: 0; border-top: 2px solid; border-left: 2px solid; border-radius: 12px 0 0 0; }
        .br { bottom: 0; right: 0; border-bottom: 2px solid; border-right: 2px solid; border-radius: 0 0 12px 0; }

        .card-header { padding: 18px; font-weight: 800; font-size: 0.95em; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; letter-spacing: 2px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--theme-primary); transition: color 1s; }
        
        /* KOLOM 1 */
        .col-kiri { flex: 1; border-top: 3px solid var(--theme-accent); transition: border-color 1s; }
        .list-container { flex: 1; overflow-y: hidden; padding: 15px; position: relative; }
        
        /* Item List (Generic) */
        .list-row { display: flex; align-items: center; padding: 10px 15px; border-radius: 8px; background: rgba(255,255,255,0.03); margin-bottom: 8px; border-left: 3px solid transparent; transition: 0.3s; }
        .list-row:hover { background: rgba(255,255,255,0.08); transform: translateX(5px); }
        .list-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; margin-right: 12px; border: 1px solid rgba(255,255,255,0.2); }
        .list-info { flex: 1; }
        .list-name { font-weight: 700; font-size: 0.9em; color: #f1f5f9; }
        .list-sub { font-size: 0.75em; color: #94a3b8; }
        .list-time { font-family: 'Share Tech Mono'; font-weight: 700; color: var(--theme-accent); font-size: 1.1em; }

        /* KOLOM 2: CHART */
        .col-center { flex: 1.4; display: flex; flex-direction: column; gap: 25px; }
        .stats-wrapper { flex: 1.5; background: rgba(15, 23, 42, 0.6); border-radius: 20px; padding: 25px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        
        .reactor-ring { position: absolute; width: 240px; height: 240px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.1); animation: spin 30s linear infinite; }
        .donut-chart { position: relative; width: 200px; height: 200px; border-radius: 50%; background: conic-gradient(var(--c) var(--p), #1e293b 0deg); display: flex; align-items: center; justify-content: center; margin-bottom: 25px; transition: 1s; box-shadow: 0 0 40px rgba(0,0,0,0.5); z-index: 1; }
        .donut-inner { width: 85%; height: 85%; background: #0f172a; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 4px solid rgba(255,255,255,0.03); }
        .big-percent { font-size: 3.5em; font-weight: 900; color: white; line-height: 0.9; position: relative; z-index: 2; text-shadow: 0 0 20px black; font-family: 'Share Tech Mono', monospace; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; width: 100%; gap: 15px; text-align: center; margin-top: 10px; }
        .stat-item { background: rgba(255,255,255,0.02); padding: 15px 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-item h4 { margin: 0 0 8px 0; font-size: 0.7em; color: #94a3b8; font-weight: 800; letter-spacing: 2px; }
        .stat-item p { margin: 0; font-size: 1.8em; font-weight: 700; font-family: 'Share Tech Mono', monospace; line-height: 1; }

        /* Box Bawah Tengah (Belum Hadir / Belum Pulang) */
        .box-middle-bottom { flex: 1; border-top: 3px solid #64748b; }
        
        /* KOLOM 3: LIVE FEED */
        .col-kanan { flex: 1.6; display: flex; flex-direction: column; gap: 25px; }
        .box-kanan-atas { flex: 1; border: 1px solid rgba(255,255,255,0.05); border-top: 3px solid var(--theme-danger); }
        .box-live { flex: 2.2; border-top: 3px solid var(--theme-primary); position: relative; transition: border-color 1s; }
        
        .live-card { display: flex; align-items: center; padding: 15px; margin-bottom: 12px; border-radius: 16px; border-left-width: 5px; border-left-style: solid; transition: all 0.5s; position: relative; overflow: hidden; background: linear-gradient(90deg, rgba(255,255,255,0.03), transparent); }
        .live-card.masuk { border-left-color: #10b981; }
        .live-card.pulang { border-left-color: #f59e0b; }
        .live-card.izin { border-left-color: #3b82f6; }
        
        .live-avatar { width: 65px; height: 65px; border-radius: 12px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); margin-right: 18px; }
        .live-badge { font-size: 0.65em; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 4px; letter-spacing: 1px; background: rgba(255,255,255,0.1); }
        
        /* ANIMATIONS */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .marquee-vertical { animation: scrollUp linear infinite; }
        @keyframes scrollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-100%); } }

        .footer-marquee { height: 5vh; background: #020617; display: flex; align-items: center; border-top: 1px solid var(--theme-primary); z-index: 10; transition: border-color 1s; }
        marquee { font-size: 1.1em; font-weight: 600; color: #e2e8f0; letter-spacing: 1.5px; font-family: 'Share Tech Mono', monospace; }

        /* TOMBOL RAHASIA (KECIL DI KANAN BAWAH) */
        .dev-btn { 
            position: fixed; 
            bottom: 5px; 
            right: 5px; 
            background: rgba(255,255,255,0.05); 
            color: #475569; 
            border: 1px solid #333; 
            padding: 2px 5px; 
            font-size: 9px; 
            z-index: 9999; 
            cursor: pointer; 
            border-radius: 3px;
        }
        .dev-btn:hover { background: red; color: white; opacity: 1; }
    </style>
</head>
<body>

    <button onclick="toggleModeManual()" class="dev-btn">⚡ FORCE MODE</button>

    <div class="header">
        <div class="brand-left">
            <img src="logo_sekolah.png" class="logo-sekolah" alt="Logo" onerror="this.style.display='none'">
            <div class="text-sekolah">
                <h1></h1>
                <span class="badge-system" id="header-subtitle">LIVE MONITORING DASHBOARD</span>
            </div>
        </div>
        <div class="header-right">
            <img src="logo.png" class="logo-siganteng" alt="EduGate" onerror="this.src='https://ui-avatars.com/api/?name=EG&background=transparent&color=fff&size=128'">
            <div class="jam-digital">
                <div class="waktu" id="jam-real">00:00</div>
                <div class="tanggal" id="tgl-real">...</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        
        <div class="card-box col-kiri" id="box-kiri">
            <div class="corner-accent tl"></div>
            <div class="card-header" id="label-kiri">
                </div>
            <div class="list-container">
                <div class="marquee-vertical" id="list-kiri"></div>
            </div>
        </div>

        <div class="col-center">
            <div class="stats-wrapper">
                <div class="corner-accent br"></div>
                <div class="reactor-ring"></div>
                <div class="donut-chart" id="chart-absen" style="--p: 0deg; --c: var(--theme-accent);">
                    <div class="donut-inner">
                        <span class="big-percent" id="persen-text">0%</span>
                        <small style="color:#94a3b8; font-size:0.7em; font-weight:700; margin-top:5px;" id="label-chart">KEHADIRAN</small>
                    </div>
                </div>
                
                <div class="stat-grid">
                    <div class="stat-item"><h4 style="color:#10b981">HADIR</h4><p id="stat-hadir">0</p></div>
                    <div class="stat-item"><h4 style="color:#f59e0b">PULANG</h4><p id="stat-pulang">0</p></div>
                    <div class="stat-item"><h4 style="color:#ef4444">BELUM</h4><p id="stat-belum">0</p></div>
                </div>
            </div>

            <div class="card-box box-middle-bottom">
                <div class="card-header" id="label-tengah-bawah">
                    </div>
                <div class="list-container">
                    <div class="marquee-vertical" id="list-tengah-bawah"></div>
                </div>
            </div>
        </div>

        <div class="col-kanan">
            <div class="card-box box-kanan-atas">
                <div class="card-header" id="label-kanan-atas">
                    </div>
                <div class="list-container">
                    <div class="marquee-vertical" id="list-kanan-atas"></div>
                </div>
            </div>

            <div class="card-box box-live">
                <div class="card-header">
                    <span><i class='bx bxs-webcam'></i> LIVE TRAFFIC</span>
                    <div style="display:flex; align-items:center; gap:5px; margin-left:auto; font-size:0.7em; color:var(--theme-primary);">● REC</div>
                </div>
                <div class="list-container" style="mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);">
                    <div class="marquee-vertical" id="live-feed"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-marquee">
        <marquee scrollamount="10" id="running-text">
            🚀 SYSTEM MONITORING ONLINE ••• EDUGATE SMAN 1 KARANGANYAR ••• DATA REALTIME
        </marquee>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = { apiKey: "AIzaSyBTanYQQ-oPkO_Zw9cg_H5V0jIJvt_x72c", authDomain: "edugate-smansakra.firebaseapp.com", projectId: "edugate-smansakra", storageBucket: "edugate-smansakra.firebasestorage.app", messagingSenderId: "181623194937", appId: "1:181623194937:web:d494810276000dceda14e8" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        
        // GLOBAL VARS
        let currentMode = 'MASUK'; // 'MASUK' or 'PULANG'
        let forceMode = null; // Untuk tombol darurat
        let allSiswa = [];
        let dataAbsen = [];
        const DEFAULT_IMG = "https://cdn-icons-png.flaticon.com/512/847/847969.png";
        
        // === 1. JADWAL OTOMATIS (MODE PULANG) ===
        function checkAutoMode() {
            if (forceMode) { setMode(forceMode); return; }

            const now = new Date();
            const day = now.getDay(); // 0=Sun, 1=Mon, ..., 5=Fri
            const hour = now.getHours();
            const min = now.getMinutes();
            const totalMin = hour * 60 + min;

            // Batas Waktu Pulang (Dalam Menit)
            // Senin-Kamis (1-4): 15:25 = 925 menit
            // Jumat (5): 13:55 = 835 menit
            let isPulangTime = false;

            if (day >= 1 && day <= 4) { // Senin - Kamis
                if (totalMin >= 925) isPulangTime = true;
            } else if (day === 5) { // Jumat
                if (totalMin >= 835) isPulangTime = true;
            }

            // Set Mode
            const targetMode = isPulangTime ? 'PULANG' : 'MASUK';
            if (currentMode !== targetMode) {
                setMode(targetMode);
            }
        }

        function setMode(mode) {
            currentMode = mode;
            const body = document.body;
            
            if (mode === 'PULANG') {
                body.classList.add('mode-pulang');
                document.getElementById('header-subtitle').innerText = "";
                document.getElementById('running-text').innerHTML = "🛑 <strong>PERHATIAN:</strong> PASTIKAN ANDA SUDAH MELAKUKAN TAP-OUT (ABSEN PULANG) SEBELUM MENINGGALKAN AREA SEKOLAH ••• HATI-HATI DI JALAN DAN SAMPAI JUMPA BESOK 👋";
            } else {
                body.classList.remove('mode-pulang');
                document.getElementById('header-subtitle').innerText = "";
                document.getElementById('running-text').innerHTML = "🚀 <strong>SELAMAT DATANG:</strong> MARI WUJUDKAN DISIPLIN WAKTU ••• EDUGATE SYSTEM ONLINE ••• PRESENSI REALTIME";
            }
            renderAllData();
        }

        window.toggleModeManual = () => {
            forceMode = currentMode === 'MASUK' ? 'PULANG' : 'MASUK';
            setMode(forceMode);
            console.log("Mode dipaksa ke: " + forceMode);
        }

        // === 2. DATA LOADERS ===
        async function loadMaster() {
            const cacheKey = 'master_siswa_v2';
            const cached = localStorage.getItem(cacheKey);
            if(cached) {
                allSiswa = JSON.parse(cached);
                initListener();
            } else {
                const q = query(collection(db, "users"), where("role","==","siswa"));
                const snap = await getDocs(q);
                snap.forEach(d => {
                    const dt = d.data();
                    if(dt.username) allSiswa.push({ nisn: dt.username, nama: dt.nama||dt.name, kelas: dt.kelas });
                });
                localStorage.setItem(cacheKey, JSON.stringify(allSiswa));
                initListener();
            }
        }

        function initListener() {
            const todayStr = new Date().toLocaleDateString('fr-CA');
            const q = query(collection(db, "absensi"), where("tanggal", "==", todayStr));
            
            onSnapshot(q, (snap) => {
                dataAbsen = [];
                snap.forEach(d => dataAbsen.push(d.data()));
                renderAllData();
            });
        }

        // === 3. RENDER LOGIC ===
        function renderAllData() {
            const hadir = dataAbsen.filter(d => !d.status_terakhir.includes("Izin") && !d.status_terakhir.includes("Sakit"));
            const pulang = dataAbsen.filter(d => d.status_terakhir.includes("Pulang"));
            const belumHadir = allSiswa.filter(s => !dataAbsen.some(a => a.nisn === s.nisn));
            const masihDiSekolah = hadir.filter(h => !pulang.some(p => p.nisn === h.nisn));

            document.getElementById('stat-hadir').innerText = hadir.length;
            document.getElementById('stat-pulang').innerText = pulang.length;
            document.getElementById('stat-belum').innerText = belumHadir.length;

            let total = allSiswa.length || 1;
            let percent = 0;
            let chartColor = '#38bdf8';

            if (currentMode === 'MASUK') {
                percent = (hadir.length / total) * 100;
                chartColor = '#10b981'; // Hijau
                document.getElementById('label-chart').innerText = "KEHADIRAN";
            } else {
                percent = (pulang.length / total) * 100;
                chartColor = '#f59e0b'; // Orange
                document.getElementById('label-chart').innerText = "KEPULANGAN";
            }
            
            document.getElementById('persen-text').innerText = percent.toFixed(1) + "%";
            document.getElementById('persen-text').style.color = chartColor;
            document.getElementById('chart-absen').style.background = `conic-gradient(${chartColor} ${percent * 3.6}deg, #1e293b 0deg)`;

            // KOLOM KIRI (BOX 1)
            const labelKiri = document.getElementById('label-kiri');
            if (currentMode === 'MASUK') {
                labelKiri.innerHTML = "<i class='bx bxs-trophy'></i> TOP 10 GASIK";
                const sorted = [...hadir].sort((a,b) => (a.jam_masuk?.seconds||0) - (b.jam_masuk?.seconds||0)).slice(0, 15);
                renderList(sorted, 'list-kiri', 'normal', 'jam_masuk');
            } else {
                labelKiri.innerHTML = "<i class='bx bxs-user-detail'></i> MASIH DI SEKOLAH";
                renderList(masihDiSekolah, 'list-kiri', 'normal', 'jam_masuk'); 
            }

            // KOLOM TENGAH BAWAH (BOX 2)
            const labelTengah = document.getElementById('label-tengah-bawah');
            if (currentMode === 'MASUK') {
                labelTengah.innerHTML = "<i class='bx bx-user-x'></i> BELUM HADIR";
                renderSimpleList(belumHadir, 'list-tengah-bawah');
            } else {
                labelTengah.innerHTML = "<i class='bx bxs-error'></i> BELUM TAP-OUT";
                renderSimpleList(masihDiSekolah, 'list-tengah-bawah');
            }

            // KOLOM KANAN ATAS (BOX 3)
            const labelKananAtas = document.getElementById('label-kanan-atas');
            if (currentMode === 'MASUK') {
                labelKananAtas.innerHTML = "<i class='bx bxs-alarm-exclamation'></i> TERLAMBAT";
                const batas = 7*3600; // Dummy
                const telat = hadir.filter(d => getJamStr(d.jam_masuk) > "07:00"); 
                renderList(telat, 'list-kanan-atas', 'danger', 'jam_masuk');
            } else {
                labelKananAtas.innerHTML = "<i class='bx bx-history'></i> BARU SAJA PULANG";
                const recentPulang = [...pulang].sort((a,b) => (b.jam_pulang?.seconds||0) - (a.jam_pulang?.seconds||0)).slice(0, 10);
                renderList(recentPulang, 'list-kanan-atas', 'highlight', 'jam_pulang');
            }

            // LIVE FEED (BOX 4)
            let feedData = [...dataAbsen];
            if (currentMode === 'PULANG') {
                 feedData.sort((a,b) => {
                     const timeA = a.jam_pulang?.seconds || a.jam_masuk?.seconds || 0;
                     const timeB = b.jam_pulang?.seconds || b.jam_masuk?.seconds || 0;
                     return timeB - timeA;
                 });
            } else {
                feedData.sort((a,b) => (b.jam_masuk?.seconds||0) - (a.jam_masuk?.seconds||0));
            }
            renderLiveCards(feedData.slice(0, 15), 'live-feed');
        }

        function renderList(data, containerId, style, timeField) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            if(data.length === 0) { c.innerHTML = '<div style="text-align:center; opacity:0.5; padding:10px;">Data Kosong</div>'; return; }
            let scrollDur = data.length * 2.5; if(scrollDur<10) scrollDur=10;
            c.style.animation = `scrollUp ${scrollDur}s linear infinite`;
            data.forEach(d => {
                const jam = getJamStr(d[timeField]);
                const img = d.foto_masuk || DEFAULT_IMG;
                let borderClr = 'transparent';
                if(style === 'danger') borderClr = '#ef4444';
                if(style === 'highlight') borderClr = '#f59e0b';
                c.innerHTML += `<div class="list-row" style="border-left-color:${borderClr}"><img src="${img}" class="list-img" onerror="this.src='${DEFAULT_IMG}'"><div class="list-info"><div class="list-name">${d.nama}</div><div class="list-sub">${d.kelas}</div></div><div class="list-time" style="color:${style==='danger'?'#ef4444':(style==='highlight'?'#f59e0b':'#38bdf8')}">${jam}</div></div>`;
            });
            if(data.length > 5) c.innerHTML += c.innerHTML;
        }

        function renderSimpleList(data, containerId) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            if(data.length === 0) { c.innerHTML = '<div style="text-align:center; opacity:0.5; padding:10px;">Nihil</div>'; return; }
            let scrollDur = data.length * 2; if(scrollDur<10) scrollDur=10;
            c.style.animation = `scrollUp ${scrollDur}s linear infinite`;
            data.forEach(d => {
                const nama = d.nama || d.name;
                c.innerHTML += `<div class="list-row"><div class="list-name" style="font-size:0.8em">${nama}</div><div class="list-sub">${d.kelas}</div></div>`;
            });
            if(data.length > 5) c.innerHTML += c.innerHTML;
        }

        function renderLiveCards(data, containerId) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            let scrollDur = data.length * 3.5; if(scrollDur<15) scrollDur=15;
            c.style.animation = `scrollUp ${scrollDur}s linear infinite`;
            data.forEach(d => {
                let status = 'MASUK'; let cls = 'masuk'; let time = getJamStr(d.jam_masuk); let img = d.foto_masuk || DEFAULT_IMG;
                if (d.status_terakhir.includes('Pulang')) { status = 'PULANG'; cls = 'pulang'; time = getJamStr(d.jam_pulang); img = d.foto_pulang || img; } 
                else if (d.status_terakhir.includes('Izin')) { status = 'IZIN'; cls = 'izin'; }
                c.innerHTML += `<div class="live-card ${cls}"><img src="${img}" class="live-avatar" onerror="this.src='${DEFAULT_IMG}'"><div class="list-info"><div class="list-name" style="font-size:1.1em">${d.nama}</div><div class="list-sub" style="font-weight:700; color:#94a3b8;">${d.kelas}</div><span class="live-badge">${status}</span></div><div class="list-time" style="font-size:1.5em">${time}</div></div>`;
            });
            if(data.length > 4) c.innerHTML += c.innerHTML;
        }

        function getJamStr(timestamp) {
            if(!timestamp) return "--:--";
            if(timestamp.seconds) return new Date(timestamp.seconds*1000).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', hour12:false}).replace('.',':');
            return String(timestamp).substring(0,5);
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('jam-real').innerText = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('tgl-real').innerText = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'});
            checkAutoMode();
        }, 1000);

        loadMaster();
    </script>
</body>
</html>
