<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduGate Siswa - SMAN 1 Karanganyar</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .hidden-page { display: none !important; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 3px; border-radius: 50%; }
        .camera-overlay { background: rgba(0,0,0,0.95); }
        .camera-box { position: relative; width: 100%; height: 100%; overflow: hidden; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden bg-slate-50">

    <input type="file" id="fileInputProfil" accept="image/*" style="display:none" onchange="prosesUploadGaleri(this, 'profil')">
    <input type="file" id="fileInputBukti" accept="image/*" style="display:none" onchange="prosesUploadGaleri(this, 'bukti')">

    <main id="main-container" class="flex-1 overflow-y-auto hide-scroll relative">
        
        <div id="page-dashboard" class="p-6 fade-in min-h-screen pb-32">
            <div class="flex flex-col items-center justify-center mb-6 mt-4">
                <div class="relative group cursor-pointer active:scale-95 transition" onclick="pilihFotoGaleri('profil')">
                    <div class="story-ring w-28 h-28 shadow-xl shadow-pink-500/20">
                        <img id="dash-foto" src="" class="w-full h-full rounded-full object-cover border-4 border-white bg-white" onerror="this.src='https://ui-avatars.com/api/?background=random&color=fff&name=Siswa'">
                    </div>
                    <div class="absolute bottom-0 right-0 bg-slate-900 text-white p-2 rounded-full border-4 border-white"><i data-lucide="camera" class="w-4 h-4"></i></div>
                </div>
                <div class="text-center mt-3">
                    <h2 class="text-2xl font-black text-slate-800 leading-tight" id="dash-nama">...</h2>
                    <span id="dash-kelas" class="text-[10px] font-black bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full uppercase tracking-wider mt-1 inline-block">...</span>
                </div>
            </div>

            <div class="bg-slate-900 rounded-[2rem] p-6 text-white shadow-2xl mb-6 relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] mb-1">Status Hari Ini</p>
                    <h1 class="text-3xl font-black tracking-tighter uppercase text-yellow-400" id="hero-status">Loading...</h1>
                    <div class="mt-4 flex gap-4 text-xs font-mono text-slate-300">
                        <div>IN: <span id="info-jam-masuk" class="text-white font-bold">--:--</span></div>
                        <div>OUT: <span id="info-jam-pulang" class="text-white font-bold">--:--</span></div>
                    </div>
                </div>
                <div class="absolute -top-6 -right-6 w-32 h-32 bg-blue-600 rounded-full blur-[50px] opacity-40"></div>
            </div>

            <!-- PANEL TIM & EKSTRA -->
            <div id="wadah-tim" class="hidden mb-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1 flex items-center gap-1">
                    <i data-lucide="trophy" class="w-3 h-3"></i> Tim & Ekstra Saya
                </h3>
                <div id="list-tim-siswa" class="space-y-2">
                    <!-- List Tim akan otomatis di-generate disini -->
                </div>
            </div>

            <div id="wadah-menu" class="grid grid-cols-4 gap-2"></div>
        </div>

        <div id="page-absen" class="hidden-page p-6 fade-in h-full bg-white flex flex-col">
            <button onclick="kembali()" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center mb-4"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-600"></i></button>
            
            <div class="text-center mb-6">
                <h1 class="font-black text-5xl text-slate-800 tracking-tighter" id="jamDigital">00:00</h1>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1" id="tanggalDigital">...</p>
                <p id="info-jadwal-admin" class="text-[10px] font-bold text-blue-500 bg-blue-50 px-3 py-1 rounded-full inline-block mt-2">Sinkronisasi Jadwal...</p>
            </div>

            <div class="relative w-full h-48 rounded-[2rem] overflow-hidden border-4 border-slate-50 shadow-inner mb-6 shrink-0">
                <div id="mapMini" class="h-full w-full z-0"></div>
                <div class="absolute bottom-2 left-0 right-0 text-center"><span class="bg-black/60 text-white text-[10px] px-3 py-1 rounded-full backdrop-blur-sm">Radius Sekolah</span></div>
            </div>
            
            <div class="flex-1 overflow-y-auto space-y-3">
                <button id="btnMasuk" onclick="klikMasuk()" class="w-full bg-blue-600 text-white p-5 rounded-[2rem] shadow-xl flex items-center gap-4 active:scale-95 transition">
                    <div class="bg-white/20 p-3 rounded-2xl"><i data-lucide="scan-face" class="w-8 h-8"></i></div>
                    <div class="text-left"><span class="block text-[10px] text-blue-200 uppercase font-bold">Sudah Sampai?</span><span class="font-black text-2xl uppercase">ABSEN MASUK</span></div>
                </button>

                <div id="groupDiSekolah" class="hidden space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <button id="btnIzinKeluar" onclick="klikIzinKeluar()" class="bg-orange-50 text-orange-600 p-4 rounded-[1.5rem] font-bold text-xs flex flex-col items-center gap-2 border border-orange-100 active:scale-95 transition">
                            <i data-lucide="door-open" class="w-6 h-6"></i> Izin Keluar
                        </button>
                        <button id="btnKembali" onclick="klikKembali()" class="hidden bg-emerald-600 text-white p-4 rounded-[1.5rem] font-bold text-xs flex flex-col items-center gap-2 shadow-lg active:scale-95 transition">
                            <i data-lucide="map-pin" class="w-6 h-6"></i> Saya Kembali
                        </button>
                    </div>

                    <button id="btnPulang" onclick="klikPulang()" class="w-full bg-slate-900 text-white p-5 rounded-[2rem] shadow-xl flex items-center gap-4 active:scale-95 transition relative overflow-hidden">
                        <div class="bg-white/10 p-3 rounded-2xl relative z-10"><i data-lucide="log-out" class="w-8 h-8"></i></div>
                        <div class="text-left relative z-10"><span class="block text-[10px] text-slate-400 uppercase font-bold">Selesai KBM?</span><span class="font-black text-2xl uppercase tracking-tighter">ABSEN PULANG</span></div>
                        <div id="efek-pamungkas" class="hidden absolute top-0 left-0 w-full h-full bg-gradient-to-r from-rose-600 to-rose-900 opacity-80 z-0"></div>
                    </button>
                </div>

                <button onclick="bukaKartu()" class="w-full mt-4 bg-white border border-slate-200 text-slate-500 p-4 rounded-[1.5rem] font-bold text-xs flex items-center justify-center gap-2 uppercase tracking-widest active:scale-95"><i data-lucide="qr-code" class="w-4 h-4"></i> Kartu Digital</button>
            </div>
        </div>

        <div id="page-sakit" class="hidden-page p-6 fade-in h-full bg-white flex flex-col overflow-y-auto">
             <button onclick="kembali()" class="mb-4 w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-600"></i></button>
             <h2 class="text-2xl font-black text-slate-800 mb-6 uppercase tracking-tighter">Lapor Berhalangan</h2>
             
             <div class="grid grid-cols-2 gap-4 mb-6">
                 <button onclick="pilihJenisIzin('Sakit')" class="p-6 rounded-2xl border-2 border-slate-100 hover:border-blue-500 hover:bg-blue-50 transition group text-center">
                    <i data-lucide="thermometer" class="w-8 h-8 mx-auto mb-2 text-slate-400 group-hover:text-blue-500"></i>
                    <span class="font-bold text-slate-600 group-hover:text-blue-600">SAKIT</span>
                 </button>
                 <button onclick="pilihJenisIzin('Izin')" class="p-6 rounded-2xl border-2 border-slate-100 hover:border-orange-500 hover:bg-orange-50 transition group text-center">
                    <i data-lucide="mail" class="w-8 h-8 mx-auto mb-2 text-slate-400 group-hover:text-orange-500"></i>
                    <span class="font-bold text-slate-600 group-hover:text-orange-600">IZIN</span>
                 </button>
             </div>

             <div id="areaUploadFoto" class="hidden space-y-4">
                 <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Alasan Lengkap</label>
                    <textarea id="ketIzin" rows="3" class="w-full p-4 rounded-2xl bg-slate-50 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Demam tinggi sejak semalam..."></textarea>
                 </div>
                 <div class="border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center">
                     <img id="previewBukti" src="" class="hidden w-full h-40 object-cover rounded-xl mb-4">
                     <p class="text-xs text-slate-400 mb-3">Upload Bukti (Surat Dokter / Chat Ortu)</p>
                     <div class="flex gap-2 justify-center">
                         <button onclick="bukaCam('BuktiSakit')" class="bg-slate-900 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2"><i data-lucide="camera" class="w-4 h-4"></i> Foto</button>
                         <button onclick="pilihFotoGaleri('bukti')" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2"><i data-lucide="image" class="w-4 h-4"></i> Galeri</button>
                     </div>
                 </div>
                 <button onclick="kirimLaporanIzin()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold text-sm uppercase tracking-widest shadow-lg shadow-blue-500/30 active:scale-95 transition">Kirim Laporan</button>
             </div>
        </div>

        <div id="page-refleksi" class="hidden-page p-6 fade-in h-full bg-white flex flex-col overflow-y-auto">
            <button onclick="kembali()" class="mb-4 w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-600"></i></button>
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-2xl font-black text-slate-800 uppercase italic leading-tight">Jurnal KBM</h2>
                    <p class="text-xs text-slate-400" id="tgl-jurnal">...</p>
                </div>
                <i data-lucide="book-open" class="w-8 h-8 text-pink-500"></i>
            </div>
            <div id="timeline-kbm" class="space-y-4 pb-20"></div>
        </div>
        
        <div id="page-profil" class="hidden-page p-6 fade-in h-full bg-white overflow-y-auto">
             <button onclick="kembali()" class="mb-4 w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-600"></i></button>
             <h2 class="text-2xl font-black text-slate-800 mb-6 uppercase">Profil & Akun</h2>
             
             <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100 space-y-4 mb-6">
                <h4 class="font-bold text-slate-700 text-sm flex items-center gap-2 uppercase tracking-tighter"><i data-lucide="lock" class="w-4 h-4 text-rose-600"></i> Ganti Password</h4>
                <input type="password" id="inputPassBaru" class="w-full p-4 rounded-2xl border border-slate-200 font-bold text-slate-700 outline-none" placeholder="Password Baru...">
                <button onclick="gantiPassword()" class="w-full bg-rose-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition">Simpan Password</button>
             </div>
             <button onclick="logout()" class="w-full text-red-500 font-bold bg-white py-4 rounded-2xl border border-red-100 uppercase text-xs tracking-widest">Logout Akun</button>
        </div>

    </main>

    <div id="modalKamera" class="hidden fixed inset-0 z-50 camera-overlay flex flex-col items-center justify-center fade-in">
        <div class="absolute top-0 w-full p-4 flex justify-between items-center z-20">
            <span class="bg-black/50 text-white px-3 py-1 rounded-full text-xs font-bold backdrop-blur">KAMERA</span>
            <button onclick="tutupKamera()" class="text-white"><i data-lucide="x" class="w-8 h-8"></i></button>
        </div>
        <div class="camera-box">
            <video id="videoStream" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
            <canvas id="canvasFoto" class="hidden"></canvas>
        </div>
        <div class="absolute bottom-10 z-20">
            <button onclick="jepretFoto()" class="w-20 h-20 rounded-full border-[6px] border-white flex items-center justify-center active:scale-90 transition shadow-2xl bg-transparent"><div class="w-16 h-16 bg-white rounded-full"></div></button>
        </div>
    </div>

    <div id="modalKartu" class="hidden fixed inset-0 z-50 bg-slate-900/95 backdrop-blur-md flex items-center justify-center p-6 fade-in">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-xs text-center shadow-2xl relative">
            <h3 class="font-black text-slate-800 text-xl mb-4 uppercase italic">Kartu Pelajar</h3>
            <div class="bg-slate-50 p-4 rounded-3xl border-2 border-dashed border-slate-200 mb-6 inline-block"><div id="qrcode"></div></div>
            <h2 id="namaDiKartu" class="font-black text-slate-800 text-lg leading-tight mb-1 uppercase tracking-tighter">...</h2>
            <p id="nisnDiKartu" class="font-mono text-slate-600 font-bold text-xs tracking-widest">...</p>
            <button onclick="document.getElementById('modalKartu').classList.add('hidden')" class="mt-8 text-slate-400 font-bold text-xs uppercase hover:text-red-500">Tutup</button>
        </div>
    </div>

    <div id="loadingOverlay" class="hidden fixed inset-0 z-[60] bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <h5 class="font-black text-slate-800 text-xs tracking-[0.2em] animate-pulse uppercase">Memproses...</h5>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, arrayUnion, serverTimestamp, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        const firebaseConfig = { apiKey: "AIzaSyBTanYQQ-oPkO_Zw9cg_H5V0jIJvt_x72c", authDomain: "edugate-smansakra.firebaseapp.com", projectId: "edugate-smansakra", storageBucket: "edugate-smansakra.firebasestorage.app", messagingSenderId: "181623194937", appId: "1:181623194937:web:d494810276000dceda14e8" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app); const storage = getStorage(app);

        let SEKOLAH_LAT = -7.6739830; let SEKOLAH_LNG = 109.6319560;
        let userSiswa = null; let lokasiUser = null; let map = null;
        let streamKamera = null; let tipeAbsenAktif = ""; let tempFotoBukti = null;
        let tempRefleksi = {}; let jenisIzinAktif = "";

        // VARIABEL JADWAL SINKRONISASI
        let jadwalHariIni = { masuk: "06:30", telat: "07:00", pulang: "15:30", libur: false };
        let modePamungkas = false;
        let pesanPamungkas = "";
        let popUpTampil = false;

        const getTodayID = () => { const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`; };

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const sessionData = sessionStorage.getItem('user_siganteng');
            if (sessionData) {
                userSiswa = JSON.parse(sessionData); userSiswa.nisn = userSiswa.username || userSiswa.nisn;
                setupUI(); syncAdminSettings(); pantauJadwalDanAturan(); cekGPS(); mulaiJam(); pantauDataRealtime(); cekKeanggotaanTim();
                if(userSiswa.foto_profil) document.getElementById('dash-foto').src = userSiswa.foto_profil;
            } else window.location.href = 'index.html';
        });

        function setupUI() {
            document.getElementById('dash-nama').innerText = userSiswa.nama;
            document.getElementById('dash-kelas').innerText = userSiswa.kelas;
            document.getElementById('tgl-jurnal').innerText = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'});
            renderMenu();
        }

        // --- SINKRONISASI JADWAL ADMIN & MODE PAMUNGKAS ---
        function pantauJadwalDanAturan() {
            const listNamaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const hariIni = listNamaHari[new Date().getDay()];

            // 1. Dengerin Jadwal Pelajaran Mingguan
            onSnapshot(doc(db, "settings", "jadwal_pelajaran"), (docSnap) => {
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    if(data[hariIni]) {
                        jadwalHariIni = data[hariIni];
                        document.getElementById('info-jadwal-admin').innerText = 
                            jadwalHariIni.libur ? "HARI INI LIBUR" : `Buka: ${jadwalHariIni.masuk} | Telat: ${jadwalHariIni.telat} | Pulang: ${jadwalHariIni.pulang}`;
                    }
                }
            });

            // 2. Dengerin Config (Mode Bebas Pulang)
            onSnapshot(doc(db, "settings", "config_sekolah"), (docSnap) => {
                if(docSnap.exists()) {
                    const d = docSnap.data();
                    modePamungkas = d.mode_bebas_pulang || false;
                    pesanPamungkas = d.pesan_bebas_pulang || "Mode Event Aktif. Siswa diperbolehkan pulang.";

                    const btnPulang = document.getElementById('btnPulang');
                    const efekPamungkas = document.getElementById('efek-pamungkas');

                    if (modePamungkas) {
                        efekPamungkas.classList.remove('hidden'); // Warnai tombol pulang jadi merah heroik
                        if (!popUpTampil) {
                            Swal.fire({
                                icon: 'info', title: 'PENGUMUMAN PENTING 📢',
                                text: pesanPamungkas, confirmButtonColor: '#e11d48', confirmButtonText: 'Siap, Mengerti!'
                            });
                            popUpTampil = true;
                        }
                    } else {
                        efekPamungkas.classList.add('hidden');
                        popUpTampil = false; // Reset kalau admin matiin
                    }
                }
            });
        }

        // --- CEK KEANGGOTAAN TIM/EKSTRA ---
        async function cekKeanggotaanTim() {
            const container = document.getElementById('list-tim-siswa');
            const wrapper = document.getElementById('wadah-tim');
            
            const q = query(collection(db, "kelas_bimbingan"));
            const snap = await getDocs(q);
            
            container.innerHTML = '';
            let found = false;

            snap.forEach(doc => {
                const d = doc.data();
                const amIIn = d.anggota && d.anggota.some(member => member.nisn === userSiswa.nisn);
                
                if (amIIn) {
                    found = true;
                    let badgeColor = "bg-indigo-100 text-indigo-600 border-indigo-200";
                    let icon = "users";
                    let textKategori = d.kategori ? d.kategori.toLowerCase() : "";
                    
                    // Logic Deteksi KSN & Basket
                    if (textKategori.includes("ksn") || textKategori.includes("olimpiade")) {
                        badgeColor = "bg-yellow-100 text-yellow-600 border-yellow-200"; icon = "trophy";
                    } else if (textKategori.includes("basket") || textKategori.includes("olahraga") || textKategori.includes("futsal") || textKategori.includes("voli")) {
                        badgeColor = "bg-emerald-100 text-emerald-600 border-emerald-200"; icon = "medal";
                    }

                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-3">
                            <div class="${badgeColor} p-2 rounded-xl border">
                                <i data-lucide="${icon}" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-700 text-sm">${d.nama_ekstra}</h4>
                                <p class="text-[10px] text-slate-400 font-bold uppercase">Pembina: <span class="text-blue-500">${d.nama_guru || 'TBA'}</span></p>
                            </div>
                        </div>
                    `;
                }
            });

            if(found) { wrapper.classList.remove('hidden'); lucide.createIcons(); }
        }

        // --- MENU DASHBOARD ---
        window.renderMenu = () => {
            const m = [
                { id:'menu-absen', l:'Presensi', i:'scan-face', c:'blue', a:"bukaHalaman('page-absen'); setTimeout(initMap,500)" },
                { id:'menu-sakit', l:'Izin/Sakit', i:'thermometer', c:'orange', a:"bukaHalaman('page-sakit')" },
                { id:'menu-jurnal', l:'Jurnal KBM', i:'book-open', c:'pink', a:"bukaHalaman('page-refleksi'); loadTimelineKBM()" },
                { id:'menu-profil', l:'Profil', i:'user', c:'indigo', a:"bukaHalaman('page-profil')" }
            ];
            const c = document.getElementById('wadah-menu'); c.innerHTML = '';
            m.forEach(x => { c.innerHTML += `<button id="${x.id}" onclick="${x.a}" class="flex flex-col items-center gap-2 p-3 bg-white rounded-2xl border border-slate-100 shadow-sm active:scale-95 transition"><div class="bg-${x.c}-50 text-${x.c}-500 p-2.5 rounded-xl"><i data-lucide="${x.i}" class="w-5 h-5"></i></div><span class="text-[9px] font-bold text-slate-600 uppercase">${x.l}</span></button>`; });
            lucide.createIcons();
        }

        // --- REALTIME STATUS & LOGIKA TOMBOL ---
        function pantauDataRealtime() {
            onSnapshot(doc(db, "absensi", `${getTodayID()}_${userSiswa.nisn}`), (docSnap) => {
                const btnMasuk = document.getElementById('btnMasuk');
                const grpSekolah = document.getElementById('groupDiSekolah');
                const btnIzinKeluar = document.getElementById('btnIzinKeluar');
                const btnKembali = document.getElementById('btnKembali');
                const btnPulang = document.getElementById('btnPulang');
                const btnMenuSakit = document.getElementById('menu-sakit');

                if (docSnap.exists()) {
                    const d = docSnap.data();
                    const st = d.status_terakhir || "";
                    document.getElementById('hero-status').innerText = st;
                    if(d.jam_masuk) document.getElementById('info-jam-masuk').innerText = new Date(d.jam_masuk.seconds*1000).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
                    if(d.jam_pulang) document.getElementById('info-jam-pulang').innerText = new Date(d.jam_pulang.seconds*1000).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});

                    if(st.includes("Pulang")) {
                        btnMasuk.classList.add('hidden'); grpSekolah.classList.add('hidden');
                        if(btnMenuSakit) btnMenuSakit.classList.add('hidden'); 
                    } else if(st === "Izin Keluar") {
                        btnMasuk.classList.add('hidden'); grpSekolah.classList.remove('hidden');
                        btnIzinKeluar.classList.add('hidden'); btnKembali.classList.remove('hidden'); 
                        btnPulang.classList.add('hidden');
                        if(btnMenuSakit) btnMenuSakit.classList.add('hidden');
                    } else if(d.jam_masuk) { 
                        btnMasuk.classList.add('hidden'); grpSekolah.classList.remove('hidden');
                        btnIzinKeluar.classList.remove('hidden'); btnKembali.classList.add('hidden');
                        btnPulang.classList.remove('hidden');
                        if(btnMenuSakit) btnMenuSakit.classList.add('hidden');
                    }
                } else {
                    document.getElementById('hero-status').innerText = "BELUM ABSEN";
                    btnMasuk.classList.remove('hidden'); grpSekolah.classList.add('hidden');
                    if(btnMenuSakit) btnMenuSakit.classList.remove('hidden');
                }
            });
        }

        // --- GPS & MAP ---
        window.initMap = () => { if(map)return; map=L.map('mapMini',{zoomControl:false}).setView([SEKOLAH_LAT,SEKOLAH_LNG],17); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); L.circle([SEKOLAH_LAT,SEKOLAH_LNG],{radius:50,color:'red'}).addTo(map); }
        window.validasiGPS = () => { if(!lokasiUser)return false; return map.distance(lokasiUser,[SEKOLAH_LAT,SEKOLAH_LNG])<=50; }
        window.cekGPS = () => navigator.geolocation.watchPosition(p=>{lokasiUser={lat:p.coords.latitude,lng:p.coords.longitude}; if(map) L.marker(lokasiUser).addTo(map);});
        window.syncAdminSettings = () => onSnapshot(doc(db,"pengaturan","sekolah"),d=>{if(d.exists()){const c=d.data();if(c.lokasi_lat)SEKOLAH_LAT=c.lokasi_lat;if(c.lokasi_lng)SEKOLAH_LNG=c.lokasi_lng;}});

        // --- VALIDASI ABSENSI MASUK & PULANG SESUAI JADWAL ADMIN ---
        window.klikMasuk = () => {
            if (jadwalHariIni.libur) {
                return Swal.fire('Hari Libur 🏝️', 'Hari ini diset Libur oleh Admin. Selamat beristirahat!', 'info');
            }

            const now = new Date();
            const curJam = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

            if (curJam < jadwalHariIni.masuk) {
                return Swal.fire({ icon: 'warning', title: 'Belum Waktunya! 😅', text: `Absen masuk baru dibuka pukul ${jadwalHariIni.masuk} WIB.`, confirmButtonColor: '#3b82f6' });
            }

            // Penentuan Status Terlambat
            let statusMasuk = "Hadir";
            if (curJam > jadwalHariIni.telat) {
                statusMasuk = "Hadir (Terlambat)";
                Swal.fire({ toast: true, position: 'top', showConfirmButton: false, timer: 3000, icon: 'warning', title: 'Anda Terlambat!' });
            }

            if(validasiGPS()) bukaCam(statusMasuk); 
            else Swal.fire('Di Luar Radius', 'Anda belum berada di area SMAN 1 Karanganyar.', 'error');
        }

        window.klikPulang = () => {
            if(!validasiGPS()) return Swal.fire('Di Luar Radius', 'Anda belum berada di area sekolah.', 'error');

            const now = new Date();
            const curJam = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

            // Cek Mode Pamungkas: Kalau nyala, bebas pulang tanpa peduli jam.
            if (!modePamungkas && curJam < jadwalHariIni.pulang) {
                 return Swal.fire({ icon: 'error', title: 'Belum Waktunya Pulang! 🛑', text: `Jam pulang normal untuk hari ini adalah pukul ${jadwalHariIni.pulang} WIB.`, confirmButtonColor: '#ef4444' });
            }

            let titleTeks = modePamungkas ? "PULANG SEKARANG?" : "Pulang Sekarang?";
            let msgTeks = modePamungkas ? "Mode Bebas Pulang aktif. Silakan pulang dengan hati-hati." : "Jam pulang sudah tiba. Hati-hati di jalan ya!";
            
            Swal.fire({
                title: titleTeks, text: msgTeks, icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, Pulang', cancelButtonText: 'Batal', confirmButtonColor: modePamungkas ? '#e11d48' : '#10b981'
            }).then((r1) => { if(r1.isConfirmed) bukaCam("Pulang"); });
        }
        
        window.klikIzinKeluar = () => { Swal.fire({ title:'Keperluan?', input:'text', showCancelButton:true }).then((r)=>{ if(r.value) kirimAbsen("Izin Keluar", r.value, "-"); }); }
        window.klikKembali = () => { if(validasiGPS()) kirimAbsen("Kembali", "Kembali ke Sekolah", "-"); }

        // --- JURNAL KBM ---
        window.loadTimelineKBM = () => {
            const container = document.getElementById('timeline-kbm');
            const q = query(collection(db, "jurnal_guru"), where("kelas", "==", userSiswa.kelas), where("tanggal", "==", getTodayID()));
            
            onSnapshot(q, (snap) => {
                let h = '';
                if(snap.empty) h = `<div class="text-center py-10 opacity-50"><p class="text-xs">Belum ada jurnal guru.</p></div>`;
                
                let journals = []; snap.forEach(d => { let j=d.data(); j.id=d.id; journals.push(j); });
                journals.sort((a,b)=>(b.waktu?.seconds||0)-(a.waktu?.seconds||0));

                journals.forEach(d => {
                    h += `
                    <div class="bg-white p-5 rounded-[1.5rem] border border-slate-100 shadow-sm mb-4">
                        <div class="flex justify-between">
                            <h4 class="font-black text-slate-800">${d.mapel}</h4>
                            <span class="text-[10px] bg-slate-100 px-2 py-1 rounded font-bold uppercase">${d.nama_guru}</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-2 mb-4 bg-slate-50 p-2 rounded">"${d.materi}"</p>
                        <div id="box-refleksi-${d.id}">
                            <div class="grid grid-cols-4 gap-2 mb-3">
                                <button onclick="pilihEmosi('${d.id}','Senang')" id="btn-${d.id}-Senang" class="emo-btn p-2 rounded-xl border border-slate-200 text-xl hover:bg-emerald-50">😄</button>
                                <button onclick="pilihEmosi('${d.id}','Terinspirasi')" id="btn-${d.id}-Terinspirasi" class="emo-btn p-2 rounded-xl border border-slate-200 text-xl hover:bg-blue-50">🤩</button>
                                <button onclick="pilihEmosi('${d.id}','Bingung')" id="btn-${d.id}-Bingung" class="emo-btn p-2 rounded-xl border border-slate-200 text-xl hover:bg-orange-50">🤔</button>
                                <button onclick="pilihEmosi('${d.id}','Ngantuk')" id="btn-${d.id}-Ngantuk" class="emo-btn p-2 rounded-xl border border-slate-200 text-xl hover:bg-rose-50">😴</button>
                            </div>
                            <input id="txt-${d.id}" class="w-full p-3 text-xs rounded-xl border border-slate-200 mb-3 bg-slate-50" placeholder="Pesan singkat...">
                            <button onclick="kirimRefleksi('${d.id}')" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest active:scale-95 transition">Kirim Respon</button>
                        </div>
                        <div id="done-${d.id}" class="hidden bg-emerald-50 p-3 rounded-xl border border-emerald-100 text-center text-emerald-600 font-bold text-xs">✅ Terkirim!</div>
                    </div>`;
                });
                container.innerHTML = h;
                journals.forEach(d => cekStatusRefleksi(d.id));
            });
        }
        window.pilihEmosi = (id,e) => { tempRefleksi[id]=e; document.querySelectorAll(`#box-refleksi-${id} .emo-btn`).forEach(b=>b.className='emo-btn p-2 rounded-xl border border-slate-200 text-xl bg-white'); document.getElementById(`btn-${id}-${e}`).className='emo-btn p-2 rounded-xl border-2 border-indigo-500 bg-indigo-50 text-xl'; }
        window.kirimRefleksi = async(id) => {
            if(!tempRefleksi[id]) return Swal.fire('Ups','Pilih emotikon dulu','warning');
            Swal.fire({title:'Mengirim...',didOpen:()=>Swal.showLoading()});
            try { await setDoc(doc(db, "feedback_kbm", `${id}_${userSiswa.nisn}`), { id_jurnal: id, nisn: userSiswa.nisn, nama: userSiswa.nama, emosi: tempRefleksi[id], pesan: document.getElementById(`txt-${id}`).value || "-", waktu: serverTimestamp(), tanggal: getTodayID() }); Swal.fire({icon:'success',title:'Terkirim',timer:1000,showConfirmButton:false}); cekStatusRefleksi(id); } catch(e) { Swal.fire('Gagal',e.message,'error'); }
        }
        async function cekStatusRefleksi(id) { const s = await getDoc(doc(db,"feedback_kbm",`${id}_${userSiswa.nisn}`)); if(s.exists()){ const b=document.getElementById(`box-refleksi-${id}`); const d=document.getElementById(`done-${id}`); if(b&&d) { b.classList.add('hidden'); d.classList.remove('hidden'); } } }

        // --- KAMERA & UPLOAD ---
        window.bukaCam = (tipe) => { tipeAbsenAktif=tipe; document.getElementById('modalKamera').classList.remove('hidden'); navigator.mediaDevices.getUserMedia({video:{facingMode:'user', aspectRatio:3/4}}).then(s=>{streamKamera=s;document.getElementById('videoStream').srcObject=s}); }
        window.tutupKamera = () => { document.getElementById('modalKamera').classList.add('hidden'); if(streamKamera) streamKamera.getTracks().forEach(t=>t.stop()); }
        window.jepretFoto = () => { const c=document.getElementById('canvasFoto'); c.width=480; c.height=640; c.getContext('2d').drawImage(document.getElementById('videoStream'),0,0,c.width,c.height); const img=c.toDataURL('image/jpeg',0.6); if(tipeAbsenAktif==='BuktiSakit') { tempFotoBukti=img; document.getElementById('previewBukti').src=img; document.getElementById('previewBukti').classList.remove('hidden'); tutupKamera(); } else { kirimAbsen(tipeAbsenAktif, "Lokasi Sesuai Radius", img); } }

        async function kirimAbsen(status, ket, foto) {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            try {
                const id = `${getTodayID()}_${userSiswa.nisn}`;
                let up = { nisn:userSiswa.nisn, nama:userSiswa.nama, kelas:userSiswa.kelas, tanggal:getTodayID(), status_terakhir:status, riwayat_kegiatan: arrayUnion(`${new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} - ${status}: ${ket}`) };
                if(foto !== "-") {
                    const snap = await uploadString(ref(storage, `absen/${getTodayID()}/${userSiswa.nisn}_${status}_${Date.now()}.jpg`), foto, 'data_url');
                    const url = await getDownloadURL(snap.ref);
                    
                    // Logic Update Data Timestamp Firebase
                    if(status.includes("Hadir")) { up.foto_masuk=url; up.jam_masuk=serverTimestamp(); up.lokasi_masuk=`${lokasiUser.lat},${lokasiUser.lng}`; }
                    else if(status==="Pulang") { up.foto_pulang=url; up.jam_pulang=serverTimestamp(); }
                }
                await setDoc(doc(db,"absensi",id), up, {merge:true});
                tutupKamera(); Swal.fire('Sukses', status+' Berhasil Tersimpan!', 'success');
            } catch(e) { Swal.fire('Error', e.message, 'error'); } 
            finally { document.getElementById('loadingOverlay').classList.add('hidden'); }
        }

        window.pilihJenisIzin = (j) => { jenisIzinAktif=j; document.getElementById('areaUploadFoto').classList.remove('hidden'); }
        window.kirimLaporanIzin = () => { const k=document.getElementById('ketIzin').value; if(!k)return; kirimAbsen(jenisIzinAktif, k, tempFotoBukti||"-"); kembali(); }
        window.bukaHalaman = (id) => { document.querySelectorAll('main > div').forEach(d=>d.classList.add('hidden-page')); document.getElementById(id).classList.remove('hidden-page'); }
        window.kembali = () => bukaHalaman('page-dashboard');
        window.logout = () => { sessionStorage.clear(); window.location.href='index.html'; }
        window.mulaiJam = () => setInterval(()=>{document.getElementById('jamDigital').innerText=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); document.getElementById('tanggalDigital').innerText=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})},1000);
        window.pilihFotoGaleri = (t) => document.getElementById(t==='profil'?'fileInputProfil':'fileInputBukti').click();
        window.prosesUploadGaleri = (i,t) => { if(i.files[0]){ const r=new FileReader(); r.onload=e=>{ if(t==='profil'){document.getElementById('dash-foto').src=e.target.result; updateProfil(e.target.result);} else {tempFotoBukti=e.target.result; document.getElementById('previewBukti').src=e.target.result; document.getElementById('previewBukti').classList.remove('hidden');} }; r.readAsDataURL(i.files[0]); } }
        async function updateProfil(img) { const s=await uploadString(ref(storage,`profil/${userSiswa.nisn}_${Date.now()}.jpg`),img,'data_url'); const u=await getDownloadURL(s.ref); await updateDoc(doc(db,"siswa",userSiswa.nisn),{foto_profil:u}); userSiswa.foto_profil=u; sessionStorage.setItem('user_siganteng',JSON.stringify(userSiswa)); }
        window.gantiPassword = async() => { const p=document.getElementById('inputPassBaru').value; if(p.length<6)return Swal.fire('Gagal','Min 6 karakter','warning'); const q=query(collection(db,"users"),where("username","==",userSiswa.username)); const s=await getDocs(q); s.forEach(async d=>await updateDoc(doc(db,"users",d.id),{password:p})); Swal.fire('Sukses','Login ulang yuk','success').then(()=>logout()); }
        window.bukaKartu = () => { document.getElementById('modalKartu').classList.remove('hidden'); document.getElementById('namaDiKartu').innerText=userSiswa.nama; document.getElementById('nisnDiKartu').innerText=userSiswa.nisn; document.getElementById("qrcode").innerHTML=""; new QRCode(document.getElementById("qrcode"),{text:userSiswa.nisn,width:150,height:150}); }

    </script>
</body>
</html>
