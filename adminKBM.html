<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kurikulum - EduGate Monitoring</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .table-sticky th { position: sticky; top: 0; z-index: 30; background: #1e293b; }
        .progress-stack { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: #334155; width: 100%; margin-top: 8px; }
        .bar-4 { background-color: #10b981; } .bar-3 { background-color: #facc15; } 
        .bar-2 { background-color: #f97316; } .bar-1 { background-color: #64748b; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-sm">

    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col hidden md:flex">
        <div class="p-6">
            <h1 class="font-black text-2xl text-yellow-500">EduGate KBM</h1>
            <p class="text-xs text-slate-500 tracking-widest uppercase mt-1">SMAN 1 KARANGANYAR</p>
            <div class="mt-2 inline-block px-2 py-1 rounded bg-yellow-900/30 text-yellow-400 text-[10px] font-bold border border-yellow-800">KURIKULUM</div>
        </div>

        <nav class="flex-1 space-y-2 px-3 mt-4">
            <button onclick="location.reload()" class="w-full flex items-center gap-3 px-4 py-3 bg-slate-800 text-white rounded-lg font-bold">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Monitoring Live
            </button>

            <div class="pt-4 pb-2">
                <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Menu Mengajar</p>
                <button onclick="bukaHalamanGuru()" class="w-full flex items-center gap-3 px-4 py-3 text-emerald-400 hover:bg-emerald-900/20 hover:text-emerald-300 rounded-lg transition border border-dashed border-emerald-900">
                    <i data-lucide="pen-tool" class="w-5 h-5"></i> Input Jurnal Saya
                </button>
            </div>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-red-500/10 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition font-bold">
                <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto bg-slate-950 p-4 md:p-8">
        
        <div class="md:hidden flex justify-between items-center mb-6">
            <h1 class="font-bold text-lg text-yellow-500">EduGate KBM</h1>
            <button onclick="bukaHalamanGuru()" class="text-emerald-500 mr-4 font-bold text-xs">Isi Jurnal</button>
            <button onclick="logout()" class="text-red-500"><i data-lucide="log-out"></i></button>
        </div>

        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-lg mb-6">
            <div class="flex flex-col md:flex-row gap-4 items-end">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Tanggal Pantau</label>
                    <input type="date" id="filter-tanggal" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-yellow-500" onchange="initRealtimeListener()">
                </div>
                <div class="flex-1 text-right">
                    <p class="text-emerald-400 font-bold animate-pulse text-xs flex justify-end items-center gap-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Live Connected
                    </p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800"><p class="text-xs text-slate-500 font-bold">JURNAL GURU</p><h3 class="text-3xl font-black text-white" id="st-jurnal">0</h3></div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800"><p class="text-xs text-slate-500 font-bold">TOTAL RESPON</p><h3 class="text-3xl font-black text-emerald-400" id="st-respon">0</h3></div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800"><p class="text-xs text-slate-500 font-bold">KEPUASAN</p><h3 class="text-3xl font-black text-yellow-400" id="st-persen">0%</h3></div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800"><p class="text-xs text-slate-500 font-bold">SISWA ABSEN</p><h3 class="text-3xl font-black text-red-400" id="st-absen">0</h3></div>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-lg">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-bold text-white">Detail Monitoring KBM</h3>
                <button onclick="downloadExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1"><i data-lucide="file-spreadsheet" class="w-3 h-3"></i> Excel</button>
            </div>
            <div class="overflow-x-auto max-h-[65vh]">
                <table class="w-full text-left text-slate-400">
                    <thead class="bg-slate-950 text-xs uppercase font-bold text-slate-500 sticky top-0 z-20 shadow-md">
                        <tr>
                            <th class="p-4 w-20">Jam</th>
                            <th class="p-4 w-24">Kelas</th>
                            <th class="p-4">Guru & Mapel</th>
                            <th class="p-4 w-80">Feedback Siswa</th>
                            <th class="p-4 w-40">Absensi</th>
                            <th class="p-4 text-center w-24">Bukti</th> </tr>
                    </thead>
                    <tbody id="tabel-body" class="divide-y divide-slate-800">
                        <tr><td colspan="6" class="p-8 text-center text-yellow-500 animate-pulse">Sedang menghubungkan ke server...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-komen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-slate-900 w-full max-w-lg rounded-2xl border border-slate-700 m-4 flex flex-col max-h-[80vh]">
            <div class="p-4 border-b border-slate-800 flex justify-between"><h3 class="font-bold text-white">Apa Kata Siswa?</h3><button onclick="document.getElementById('modal-komen').classList.add('hidden')" class="text-slate-400"><i data-lucide="x"></i></button></div>
            <div id="list-komen" class="p-4 overflow-y-auto space-y-2 text-sm flex-1"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // 🔥 KONFIGURASI FIREBASE
        const firebaseConfig = { apiKey: "AIzaSyBTanYQQ-oPkO_Zw9cg_H5V0jIJvt_x72c", authDomain: "edugate-smansakra.firebaseapp.com", projectId: "edugate-smansakra", storageBucket: "edugate-smansakra.firebasestorage.app", messagingSenderId: "181623194937", appId: "1:181623194937:web:d494810276000dceda14e8" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        
        let listeners = [];
        let rawDataExcel = []; // Simpan data untuk Excel

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            document.getElementById('filter-tanggal').valueAsDate = new Date();
            initRealtimeListener();
        });

        // 🟢 NAVIGASI KE INPUT JURNAL
        window.bukaHalamanGuru = () => {
            // Kita arahkan ke guru.html
            // Karena ini Admin, asumsinya dia punya akses login yang sama
            window.location.href = 'guru.html';
        }

        window.initRealtimeListener = () => {
            listeners.forEach(unsub => unsub()); listeners = [];
            const tgl = document.getElementById('filter-tanggal').value;
            const tbody = document.getElementById('tabel-body');
            tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-500 animate-pulse">Memindai Jurnal Guru...</td></tr>';

            const q = query(collection(db, "jurnal_guru"), where("tanggal", "==", tgl));
            
            const unsub = onSnapshot(q, (snap) => {
                if(snap.empty) { tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-500">Belum ada guru mengisi jurnal hari ini.</td></tr>'; return; }

                let rows = [];
                snap.forEach(doc => { let d = doc.data(); d.id = doc.id; rows.push(d); });
                rows.sort((a,b) => (b.waktu?.seconds || 0) - (a.waktu?.seconds || 0));

                tbody.innerHTML = '';
                document.getElementById('st-jurnal').innerText = rows.length;
                rawDataExcel = rows; // Simpan utk excel

                rows.forEach(d => {
                    const jam = d.waktu ? new Date(d.waktu.seconds*1000).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) : '-';
                    
                    // RENDER ABSEN
                    let absenHtml = '<span class="text-emerald-500 font-bold text-[10px]">Lengkap</span>';
                    let cAbsen = 0;
                    if(d.absensi_mapel) {
                        const abs = d.absensi_mapel.filter(x => x.status !== 'H');
                        cAbsen = abs.length;
                        if(cAbsen > 0) absenHtml = abs.map(x => `<span class="block text-[10px] ${x.status=='A'?'text-red-400':(x.status=='S'?'text-blue-400':'text-orange-400')}">${x.nama} (${x.status})</span>`).join('');
                    }

                    // RENDER FOTO BUKTI
                    const fotoHtml = d.foto_bukti 
                        ? `<img src="${d.foto_bukti}" onclick="Swal.fire({imageUrl:'${d.foto_bukti}', showConfirmButton:false, background:'#1e293b'})" class="w-10 h-10 object-cover rounded-lg border border-slate-700 cursor-pointer hover:scale-110 transition">` 
                        : '<span class="text-xs text-slate-600">-</span>';

                    // RENDER BARIS TABEL
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-900 border-b border-slate-800 transition">
                            <td class="p-4 align-top font-mono text-yellow-500 text-xs font-bold">${jam}</td>
                            <td class="p-4 align-top"><span class="bg-slate-800 px-2 py-1 rounded text-xs font-bold text-slate-300">${d.kelas}</span></td>
                            <td class="p-4 align-top">
                                <div class="font-bold text-white">${d.nama_guru}</div>
                                <div class="text-xs text-yellow-600 font-bold mb-1">${d.mapel}</div>
                                <p class="text-[10px] text-slate-500 line-clamp-1">"${d.materi}"</p>
                            </td>
                            <td class="p-4 align-top" id="cell-${d.id}">
                                <div class="flex items-center gap-2 text-slate-500 text-xs"><i data-lucide="loader" class="w-3 h-3 animate-spin"></i> Load...</div>
                            </td>
                            <td class="p-4 align-top" data-absen="${cAbsen}">${absenHtml}</td>
                            <td class="p-4 align-top text-center">${fotoHtml}</td>
                        </tr>`;
                    
                    // PANGGIL MATA DEWA (Cari data respon)
                    cariDataRespon(d.id);
                });
                lucide.createIcons();
            });
            listeners.push(unsub);
        }

        function cariDataRespon(idJurnal) {
            // Cek Sub-Collection (Data Lama/Standard)
            const q1 = collection(db, "jurnal_guru", idJurnal, "refleksi");
            // Cek Koleksi Luar (Data Baru/Feedback KBM)
            const q2 = query(collection(db, "feedback_kbm"), where("id_jurnal", "==", idJurnal));

            let allData = [];
            const renderHasil = () => {
                const container = document.getElementById(`cell-${idJurnal}`);
                if(!container) return;

                if(allData.length === 0) {
                    container.innerHTML = `<span class="text-xs text-slate-600 italic border border-slate-800 px-2 py-1 rounded">Belum ada respon.</span>`;
                    container.dataset.total = 0; container.dataset.positif = 0;
                    updateStats();
                    return;
                }

                // Hitung Statistik
                let s = { r4:0, r3:0, r2:0, r1:0, komen:[] };
                allData.forEach(r => {
                    const em = (r.emosi || '').toLowerCase();
                    if(em.includes('senang') || em.includes('4')) s.r4++;
                    else if(em.includes('terinspirasi') || em.includes('paham') || em.includes('3')) s.r3++;
                    else if(em.includes('bingung') || em.includes('2')) s.r2++;
                    else s.r1++; 
                    if(r.pesan && r.pesan.length > 2 && r.pesan !== '-') s.komen.push(r);
                });

                const total = allData.length;
                const p4 = (s.r4/total)*100; const p3 = (s.r3/total)*100; const p2 = (s.r2/total)*100; const p1 = (s.r1/total)*100;
                const komenSafe = encodeURIComponent(JSON.stringify(s.komen));
                
                container.innerHTML = `
                    <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1">
                        <span class="text-emerald-400">🥰 ${s.r4}</span>
                        <span class="text-yellow-400">💡 ${s.r3}</span>
                        <span class="text-orange-400">😵‍💫 ${s.r2}</span>
                        <span class="text-slate-500">😴 ${s.r1}</span>
                        <span class="text-white ml-2 bg-slate-800 px-1 rounded">Total: ${total}</span>
                    </div>
                    <div class="progress-stack">
                        <div class="bar-4" style="width:${p4}%"></div>
                        <div class="bar-3" style="width:${p3}%"></div>
                        <div class="bar-2" style="width:${p2}%"></div>
                        <div class="bar-1" style="width:${p1}%"></div>
                    </div>
                    ${s.komen.length > 0 ? `<button onclick="bukaKomen('${komenSafe}')" class="mt-2 w-full text-center text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 py-1 rounded border border-slate-700 transition">💬 Baca ${s.komen.length} Testimoni</button>` : ''}
                `;
                container.dataset.total = total;
                container.dataset.positif = s.r4 + s.r3;
                updateStats();
            };

            const unsub1 = onSnapshot(q1, (snap) => {
                let data1 = []; snap.forEach(d => data1.push(d.data()));
                if(data1.length > 0) { allData = data1; renderHasil(); } 
                else {
                     const unsub2 = onSnapshot(q2, (snap2) => {
                         let data2 = []; snap2.forEach(d => data2.push(d.data()));
                         if(data2.length > 0) { allData = data2; renderHasil(); } else { allData = []; renderHasil(); }
                     });
                     listeners.push(unsub2);
                }
            });
            listeners.push(unsub1);
        }

        function updateStats() {
            let tRespon = 0; let tPositif = 0; let tAbsen = 0;
            document.querySelectorAll('[id^="cell-"]').forEach(el => { tRespon += parseInt(el.dataset.total||0); tPositif += parseInt(el.dataset.positif||0); });
            document.querySelectorAll('td[data-absen]').forEach(el => { tAbsen += parseInt(el.dataset.absen||0); });
            document.getElementById('st-respon').innerText = tRespon;
            document.getElementById('st-absen').innerText = tAbsen;
            const persen = tRespon > 0 ? Math.round((tPositif/tRespon)*100) : 0;
            document.getElementById('st-persen').innerText = persen + "%";
        }

        window.bukaKomen = (json) => {
            const data = JSON.parse(decodeURIComponent(json));
            const c = document.getElementById('list-komen'); c.innerHTML = '';
            data.forEach(k => { c.innerHTML += `<div class="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-2"><div class="flex justify-between text-xs font-bold text-slate-400 mb-1"><span>${k.nama}</span><span>${k.emosi}</span></div><p class="text-xs text-slate-200 italic">"${k.pesan}"</p></div>`; });
            document.getElementById('modal-komen').classList.remove('hidden');
        }

        window.logout = () => { localStorage.clear(); window.location.href='index.html'; }
        
        // DOWNLOAD EXCEL SIMPLE
        window.downloadExcel = () => {
             if(rawDataExcel.length === 0) return Swal.fire('Data Kosong','Tidak ada data untuk diunduh','warning');
             const dataXls = rawDataExcel.map(d => ({
                 TANGGAL: d.tanggal,
                 JAM: d.waktu ? new Date(d.waktu.seconds*1000).toLocaleTimeString() : '',
                 GURU: d.nama_guru,
                 KELAS: d.kelas,
                 MAPEL: d.mapel,
                 MATERI: d.materi,
                 BUKTI_FOTO: d.foto_bukti || 'Tidak ada'
             }));
             const ws = XLSX.utils.json_to_sheet(dataXls);
             const wb = XLSX.utils.book_new();
             XLSX.utils.book_append_sheet(wb, ws, "Jurnal KBM");
             XLSX.writeFile(wb, `Jurnal_KBM_${document.getElementById('filter-tanggal').value}.xlsx`);
        }
    </script>
</body>
</html>
